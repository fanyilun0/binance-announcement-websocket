services:
  biance-wss-connection:
    build: 
      context: .
      args:
        - HTTP_PROXY=http://host.docker.internal:7890
        - HTTPS_PROXY=http://host.docker.internal:7890
    container_name: biance-wss-connection
    volumes:
      - .:/app:cached
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/logs
      - /app/json
      - ./state:/app/state
    environment:
      - TZ=Asia/Shanghai
      - ENV=dev
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - STATE_DIR=/app/state
      - HTTP_PROXY=http://host.docker.internal:7890
      - HTTPS_PROXY=http://host.docker.internal:7890
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: '0.5gb'
    restart: "always"
    command: python -u main.py
